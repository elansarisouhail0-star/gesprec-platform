<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gestion Précurseurs — EMIC - TMLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg: #14181D;;
    --panel: #1B2027;
    --panel-2: #20262E;
    --line: #2C333D;
    --text: #EDEBE4;
    --text-dim: #9AA3AD;
    --orange: #FF6A2B;
    --amber: #F2B705;
    --green: #2E9B6B;
    --red: #E4432B;
    --blue: #4C8DFF;
    --radius: 10px;
    --display: 'Barlow Condensed', sans-serif;
    --body: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{ min-height:100%; }
  body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text); font-family:var(--body);
    -webkit-font-smoothing:antialiased;
  }
  body.has-sidebar{
    background:#fff;
  }
  #app{ display:flex; min-height:100vh; background:var(--bg); }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:240px; flex-shrink:0; background:#fff; border-right:1px solid #f0c4aa;
    display:flex; flex-direction:column; padding:14px 12px; min-height:100vh; height:100vh;
    position:sticky; top:0; overflow:auto;
  }
  .brand{ display:flex; flex-direction:column; align-items:center; gap:2px; margin-bottom:30px; padding:0 2px; width:100%; user-select:none; cursor:default; }
  .brand.home-link{ cursor:pointer; }
  .brand .mark{ width:30px; height:30px; border-radius:6px; background:linear-gradient(135deg,var(--orange),var(--amber)); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; color:#14181D; font-size:16px;}
  .brand .brand-logo{ width:68px; height:28px; object-fit:contain; flex-shrink:0; border-radius:6px; }
  .brand .name{ font-family:var(--display); font-weight:800; font-size:31px; letter-spacing:0.1px; white-space:normal; line-height:.92; color:#8f2f0b; text-align:center; width:100%; }
  .brand .sub{ font-size:9.5px; color:#ff7a35; letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap; text-align:center; }

  .navitem{
    display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; cursor:pointer;
    color:#8f2f0b; font-weight:700; font-size:13.8px; margin-bottom:2px; border:1px solid transparent;
  }
  .navitem:hover{ background:#fff7f3; color:#7c2608; }
  .navitem.active{ background:#fff0e8; color:#7c2608; border-color:#d06a3c; font-weight:800;}
  .navitem .badge{ margin-left:auto; background:var(--red); color:#fff; font-size:10.5px; font-weight:700; border-radius:10px; padding:1px 7px; font-family:var(--mono);}

  .sidebar-footer{ margin-top:auto; padding:8px 4px 0; border-top:1px solid #f0c4aa; }
  .role-box{ font-size:10.5px; color:#8f2f0b; margin-bottom:5px; text-transform:uppercase; letter-spacing:1px;}

  /* ---------- MAIN ---------- */
  .main{ flex:1; padding:20px 26px; max-width:none; min-height:100vh; background:var(--bg); }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
  .topbar h1{ font-family:var(--display); font-weight:700; font-size:28px; margin:0; letter-spacing:0.2px;}
  .atelier-pill{
    display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line);
    padding:7px 14px; border-radius:20px; font-size:13px; color:var(--text-dim);
  }
  .atelier-pill b{ color:var(--text); font-weight:600;}
  .qr-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green);}
  .locked-atelier{
    margin-left:8px; color:var(--text-dim); font-weight:700; background:var(--panel-2);
    border:1px solid var(--line); border-radius:7px; padding:6px 12px; min-width:150px; text-align:center;
  }

  /* ---------- KPI CARDS ---------- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:22px; }
  .kpi-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 16px 14px; }
  .kpi-card .val{ font-family:var(--display); font-size:32px; font-weight:700; line-height:1; }
  .kpi-card .lbl{ font-size:11.5px; color:var(--text-dim); margin-top:6px; text-transform:uppercase; letter-spacing:0.6px;}
  .kpi-card.orange .val{ color:var(--orange); }
  .kpi-card.red .val{ color:var(--red); }
  .kpi-card.green .val{ color:var(--green); }

  .charts-row{ display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:14px; margin-bottom:22px;}
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; }
  .panel h3{ font-family:var(--display); font-weight:600; font-size:16px; margin:0 0 12px; color:var(--text); letter-spacing:0.3px;}
  .panel canvas{ max-height:220px; }

  /* heatmap */
  .heat-grid{ display:flex; flex-direction:column; gap:6px; }
  .heat-row{ display:flex; align-items:center; gap:10px; }
  .heat-row .name{ width:150px; font-size:12.5px; color:var(--text-dim); flex-shrink:0;}
  .heat-bar-bg{ flex:1; height:14px; background:var(--panel-2); border-radius:4px; overflow:hidden;}
  .heat-bar{ height:100%; border-radius:4px; }
  .heat-bar-multi{ display:flex; height:100%; border-radius:4px; overflow:hidden; }
  .heat-seg{ height:100%; }
  .heat-row .count{ width:22px; text-align:right; font-family:var(--mono); font-size:12px; color:var(--text-dim);}
  .heat-legend{ display:flex; gap:16px; margin-top:12px; flex-wrap:wrap; }
  .heat-legend .li{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-dim); }
  .heat-legend .dot{ width:9px; height:9px; border-radius:50%; }

  /* ---------- KANBAN ---------- */
  .kanban{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; align-items:start; }
  .kcol{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:10px; min-height:120px;}
  .kcol h4{ font-family:var(--display); font-size:14.5px; font-weight:600; margin:2px 4px 10px; display:flex; justify-content:space-between; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px;}
  .kcol h4 span{ font-family:var(--mono); color:var(--text); }
  .card{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px 11px; margin-bottom:8px;
    cursor:pointer; transition:border-color .15s;
  }
  .card:hover{ border-color:var(--orange); }
  .card .cid{ font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-bottom:5px;}
  .card .ctitle{ font-size:13px; font-weight:600; margin-bottom:6px; line-height:1.3;}
  .card .meta{ display:flex; gap:6px; flex-wrap:wrap; }
  .tag{ font-size:9.5px; padding:2px 7px; border-radius:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px;}
  .tag.g-faible{ background:rgba(46,155,107,.18); color:var(--green);}
  .tag.g-moyen{ background:rgba(242,183,5,.18); color:var(--amber);}
  .tag.g-important{ background:rgba(255,106,43,.18); color:var(--orange);}
  .tag.g-critique{ background:rgba(228,67,43,.2); color:var(--red);}
  .tag.cat{ background:rgba(76,141,255,.15); color:var(--blue); }

  /* ---------- FORM ---------- */
  .form-panel{ max-width:760px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px;}
  .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time], .field textarea, .field select{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:10px 12px;
    border-radius:7px; font-family:var(--body); font-size:14px;
  }
  .field input[type=file]{
    width:100%; background:var(--panel-2); border:1px dashed var(--line); color:var(--text-dim); padding:10px 12px;
    border-radius:7px; font-family:var(--body); font-size:13px;
  }
  .locked-atelier-field{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
    padding:10px 12px; border-radius:7px; font-weight:700;
  }
  .field textarea{ min-height:90px; resize:vertical; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .grav-options{ display:flex; gap:8px; }
  .grav-btn{ flex:1; padding:12px 6px; border-radius:8px; border:1.5px solid var(--line); background:var(--panel-2); color:var(--text-dim);
    cursor:pointer; text-align:center; font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.3px;}
  .grav-btn.sel-faible.on{ border-color:var(--green); background:rgba(46,155,107,.15); color:var(--green);}
  .grav-btn.sel-moyen.on{ border-color:var(--amber); background:rgba(242,183,5,.15); color:var(--amber);}
  .grav-btn.sel-important.on{ border-color:var(--orange); background:rgba(255,106,43,.15); color:var(--orange);}
  .grav-btn.sel-critique.on{ border-color:var(--red); background:rgba(228,67,43,.18); color:var(--red);}

  .btn{
    background:var(--orange); color:#14181D; border:none; padding:11px 22px; border-radius:8px; font-weight:700;
    font-size:14px; cursor:pointer; font-family:var(--body); letter-spacing:0.2px;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn.secondary{ background:transparent; border:1.5px solid var(--line); color:var(--text); }
  .btn.danger{ background:var(--red); color:#fff; }
  .btn.small{ padding:7px 14px; font-size:12.5px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  .photo-drop{
    border:1.5px dashed var(--line); border-radius:8px; padding:16px; text-align:center; color:var(--text-dim);
    font-size:13px; cursor:pointer; background:var(--panel-2);
  }
  .photo-thumbs{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .photo-thumbs img{ width:64px; height:64px; object-fit:cover; border-radius:6px; border:1px solid var(--line); cursor:zoom-in;}

  /* ---------- MODAL / DETAIL ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(10,12,15,0.72); display:flex; align-items:flex-start; justify-content:center;
    padding:40px 20px; overflow-y:auto; z-index:50;}
  .modal{ background:var(--panel); border:1px solid var(--line); border-radius:14px; width:100%; max-width:760px; padding:26px 28px 30px; }
  .modal-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .modal-head h2{ font-family:var(--display); font-size:24px; margin:0; }
  .close-x{ cursor:pointer; color:var(--text-dim); font-size:22px; line-height:1;}
  .status-pipeline{ display:flex; gap:4px; margin:16px 0 22px; }
  .pstep{ flex:1; height:6px; border-radius:3px; background:var(--line); }
  .pstep.done{ background:var(--orange); }
  .section-title{ font-family:var(--display); font-size:15px; font-weight:700; color:var(--orange); text-transform:uppercase; letter-spacing:0.5px; margin:18px 0 10px;}
  .kv{ display:grid; grid-template-columns:150px 1fr; gap:6px 10px; font-size:13.5px; margin-bottom:4px;}
  .kv .k{ color:var(--text-dim); }
  .hist{ border-left:2px solid var(--line); padding-left:14px; margin-top:6px;}
  .hist-item{ position:relative; padding-bottom:12px; font-size:12.5px; color:var(--text-dim); cursor:pointer;}
  .hist-item::before{ content:''; position:absolute; left:-19px; top:3px; width:8px; height:8px; border-radius:50%; background:var(--orange);}
  .hist-item.open::before{ background:#69717c; box-shadow:0 0 0 3px rgba(105,113,124,.18); }
  .hist-item b{ color:var(--text); }
  .hist-summary{ margin-top:4px; color:#b6c0cc; font-size:12px; line-height:1.35; }
  .hist-detail{ display:none; margin-top:6px; background:var(--panel-2); border:1px solid var(--line); border-radius:7px; padding:9px 10px; color:#8f98a3; }
  .hist-item.open .hist-detail{ display:block; }
  .image-preview{ position:fixed; inset:0; background:rgba(10,12,15,.86); display:flex; align-items:center; justify-content:center; z-index:120; padding:24px; }
  .image-preview img{ max-width:92vw; max-height:88vh; border-radius:8px; border:1px solid var(--line); background:#fff; }

  .empty{ color:var(--text-dim); font-size:13px; padding:20px; text-align:center; }
  .notif-row{ padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px; align-items:center; }
  .notif-row.is-read{ opacity:0.55; }
  .notif-filters{ display:grid; grid-template-columns:minmax(0,1fr) 190px auto; gap:10px; margin:0 0 14px; }
  .notif-filters input{ width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:7px; padding:9px 11px; font-family:var(--body); font-size:13px; }
  .notif-search-btn{ min-width:118px; justify-content:center; }
  .btn.voir-unread{ background:var(--orange); color:#14181D; border:none; }
  .btn.voir-read{ background:transparent; border:1.5px solid var(--green); color:var(--green); }
  .section-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .toast{
    position:fixed; bottom:22px; left:22px; background:var(--panel); border:1px solid var(--orange); color:var(--text);
    padding:12px 18px; border-radius:9px; font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:100; max-width:320px;
  }
  ::placeholder{ color:#6b7480; }

  /* ---------- AUTH / LOGIN GATE ---------- */
  .login-wrap{
    min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:27vh 24px 20vh;
    background:
      linear-gradient(90deg, rgba(7,13,19,.06), rgba(7,13,19,.12)),
      url("/assets/profile-background-20260715.png") center center / 100% 100% no-repeat;
  }
  .login-card{
    width:100%; max-width:560px; background:rgba(20,24,29,.72); border:1px solid rgba(255,255,255,.22);
    border-radius:14px; padding:22px; box-shadow:0 24px 70px rgba(0,0,0,.38);
    backdrop-filter:blur(7px);
  }
  .login-card.profile-choice-card{ max-width:760px; margin:0 auto; padding:16px; background:rgba(20,24,29,.66); }
  .receipt-banner{
    border:1px solid rgba(46,155,107,.55); background:rgba(46,155,107,.16); color:#eafff4;
    border-radius:10px; padding:11px 13px; margin-bottom:14px; text-align:center; font-weight:700;
  }
  .login-sub{ text-align:center; color:#fff; font-size:13.5px; margin-bottom:12px; font-weight:700; text-shadow:0 2px 8px rgba(0,0,0,.55); }
  .role-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:10px; }
  .role-card{
    border:1px solid rgba(255,255,255,.24); background:rgba(20,32,43,.82); border-radius:9px; padding:8px 9px; cursor:pointer;
    text-align:center; transition:border-color .15s, background .15s;
  }
  .role-card:hover{ border-color:var(--orange); background:rgba(255,106,43,.22); }
  .role-card.sel{ border-color:var(--orange); background:rgba(255,106,43,0.3); }
  .role-card.full-width{ grid-column:1 / -1; }
  .role-card .ric{ font-size:17px; margin-bottom:4px; }
  .role-card .rname{ font-weight:700; font-size:12.5px; color:#fff; }
  .role-card .rdesc{ font-size:9.5px; color:#d8e0e8; text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }
  .login-fields{ border-top:1px solid rgba(255,255,255,.22); padding-top:16px; margin-top:4px; }
  .login-error{ color:var(--red); font-size:12.5px; margin:-4px 0 10px; }
  .login-hint{ text-align:center; color:var(--text-dim); font-size:11.5px; padding-top:4px; }
  .check-list{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .check-option{
    display:flex; align-items:flex-start; gap:9px; min-height:42px; border:1px solid var(--line); background:var(--panel-2);
    border-radius:8px; padding:9px 10px; cursor:pointer; user-select:none; transition:border-color .15s, background .15s;
  }
  .check-option:hover{ border-color:var(--orange); }
  .check-option.selected{ border-color:var(--orange); background:rgba(255,106,43,.16); }
  .check-option .check-icon{
    width:18px; height:18px; flex-shrink:0; border-radius:5px; border:1px solid var(--text-dim); color:transparent;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; margin-top:1px;
  }
  .check-option.selected .check-icon{ background:var(--orange); border-color:var(--orange); color:#14181D; }
  .check-option .check-main{ font-size:13px; font-weight:700; color:var(--text); line-height:1.25; }
  .check-option .check-sub{ font-size:11px; color:var(--text-dim); margin-top:2px; line-height:1.25; word-break:break-word; }
  .selected-phone-list{ display:flex; flex-direction:column; gap:6px; }
  .selected-phone-pill{ border:1px solid var(--line); border-radius:8px; background:var(--panel-2); padding:8px 10px; font-size:12px; color:var(--text); }
  .selected-phone-pill b{ color:var(--orange); }

  @media (max-width: 820px){
    body.has-sidebar{ background:var(--bg); }
    #app{ flex-direction:column; min-height:100vh; }
    .sidebar{
      width:100%; min-height:auto; border-right:none; border-bottom:1px solid #f0c4aa;
      padding:10px; gap:6px; height:auto; position:relative; overflow:visible;
    }
    .brand{ margin-bottom:10px; }
    .brand .name{ font-size:24px; line-height:1; }
    .brand .sub{ font-size:8.5px; letter-spacing:1px; white-space:normal; }
    .navitem{ margin-bottom:4px; }
    .sidebar-footer{ margin-top:8px; }
    .main{ width:100%; max-width:none; padding:14px; }
    .topbar{ flex-direction:column; align-items:flex-start; gap:10px; margin-bottom:14px; }
    .topbar h1{ font-size:24px; }
    .atelier-pill{ width:100%; flex-wrap:wrap; border-radius:10px; }
    .atelier-pill select{ max-width:100%; }
    .kpi-grid, .charts-row, .kanban, .row2, .row3, .role-grid, .check-list{
      grid-template-columns:1fr !important;
    }
    .panel, .login-card{ padding:14px; }
    .login-wrap{ padding:2vh 14px 14px; background-position:center center; background-size:100% 100%; }
    .modal{ max-width:100%; padding:18px 16px; border-radius:10px; }
    .overlay{ padding:10px; }
    .kv{ grid-template-columns:1fr; gap:2px; }
    .notif-row{ flex-direction:column; align-items:flex-start; }
    .btn{ width:100%; }
    .btn.small{ width:auto; }
    .section-header{ flex-direction:column; align-items:flex-start; gap:10px; }
    .photo-thumbs img{ width:58px; height:58px; }
  }

  /* ---------- SOLO (DECLARANT) LAYOUT ---------- */
  .main.solo{ max-width:760px; margin:0 auto; width:100%; }
  .solo-top{ display:flex; align-items:center; justify-content:center; padding:20px 0 6px; }
  .solo-logout{ font-size:12.5px; color:var(--text-dim); cursor:pointer; border:1px solid var(--line); padding:6px 12px; border-radius:7px; }
  .solo-logout:hover{ color:var(--text); border-color:var(--orange); }

  /* ---------- SIDEBAR CURRENT ROLE / LOGOUT ---------- */
  .current-role{ font-size:13px; font-weight:700; color:#8f2f0b; margin-bottom:7px; }
  .logout-btn{
    width:100%; background:#fff7f3; border:1px solid #f0c4aa; color:#8f2f0b; padding:7px 10px;
    border-radius:7px; font-family:var(--body); font-size:12.5px; font-weight:700; cursor:pointer; text-align:center;
  }
  .logout-btn:hover{ color:#7c2608; border-color:#d06a3c; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= STATE & STORAGE ============================= */
const ATELIERS = [
  "HITACHI Remise",
  "HITACHI VA",
  "DIESEL",
  "POSTE GASOIL",
  "MAGASIN DIESEL",
  "LABORATOIRE ÉLECTRONIQUE",
  "MAGASIN LOCAL",
  "TOUR EN FOSSE",
  "AJUSTAGE",
  "ANSALDO",
  "APPROVISIONNEMENT",
  "RH",
  "COORDINATION",
  "PRESTATAIRES MALOCO",
  "INSTALLATION ET OUTILLAGE"
];
const CATEGORIES = ["Sécurité","Sûreté","Maintenance","Qualité","Environnement"];
const GRAVITES = [
  {key:"faible", label:"Faible", color:"var(--green)"},
  {key:"moyen", label:"Moyen", color:"var(--amber)"},
  {key:"important", label:"Important", color:"var(--orange)"},
  {key:"critique", label:"Critique", color:"var(--red)"}
];
const STATUS_ORDER = ["nouvelle","analyse","replanification","affecte","planifie","realisee","cloture"];
const STATUS_LABEL = {
  nouvelle:"Nouvelle", analyse:"En analyse", replanification:"Replanification", affecte:"Affecté", planifie:"Planifié",

function calendarDateValue(value){
  if(!value || value === "â€”" || value === "—" || value === "-") return "";
  const text = String(value).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
  const m = text.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s|,|$)/);
  if(m) return `${m[3]}-${m[2]}-${m[1]}`;
  const d = new Date(text);
  return isNaN(d.getTime()) ? "" : d.toISOString().slice(0,10);
}

function daysBetween(start, end){
  const s = calendarDateValue(start);
  const e = calendarDateValue(end);
  if(!s || !e) return 0;
  const ms = new Date(e + "T00:00:00") - new Date(s + "T00:00:00");
  return Math.max(0, Math.round(ms / 86400000));
}

function splitMulti(value){
  return String(value || "").split(/[;,]/).map(x=>x.trim()).filter(Boolean);
}

function treatmentUsersForAtelier(atelier){
  return (state.users || []).filter(u=>{
    if(u.role !== "traitement") return false;
    return splitMulti(u.responsible_ateliers).includes(atelier);
  });
}

function collaboratorUsersForAtelier(atelier){
  return (state.users || []).filter(u=>{
    if(u.role !== "collaborateur") return false;
    const ateliers = splitMulti(u.responsible_ateliers);
    return !ateliers.length || ateliers.includes(atelier);
  });
}

function phonesForUsers(users){
  const rows = [];
  users.forEach(u=>{
    const phones = splitMulti(u.phone_numbers);
    if(phones.length){
      phones.forEach(phone=>rows.push({name:u.full_name, phone}));
    }else{
      rows.push({name:u.full_name, phone:"Telephone non renseigne"});
    }
  });
  return rows;
}

function phoneStringForUsers(users){
  const phones = [];
  users.forEach(u=>splitMulti(u.phone_numbers).forEach(phone=>{
    if(!phones.includes(phone)) phones.push(phone);
  }));
  return phones.join(", ");
}

function isHSERole(r){ return r==="hse" || r==="chef_centre" || r==="coordination"; }

const hasStorage = typeof window.storage !== "undefined";
async function loadData(){
  try{
    if(hasStorage){
      const d = await window.storage.get("declarations", true).catch(()=>null);
      const n = await window.storage.get("notifications", true).catch(()=>null);
      state.declarations = d ? JSON.parse(d.value) : [];
      state.notifications = n ? JSON.parse(n.value) : [];
    }
  }catch(e){ console.warn("Storage indisponible, mode mémoire locale.", e); }
  render();
}
async function persist(){
  if(!hasStorage) return;
  try{
    await window.storage.set("declarations", JSON.stringify(state.declarations), true);
    await window.storage.set("notifications", JSON.stringify(state.notifications), true);
  }catch(e){ console.warn("Échec de sauvegarde", e); }
}

function genId(){
  const n = state.declarations.length + 1;
  const y = new Date().getFullYear();
  return "PRC-" + y + "-" + String(n).padStart(4,"0");
}
function nowStr(){ return new Date().toLocaleString("fr-FR"); }

function pushHistory(dec, label){
  dec.historique.push({date: nowStr(), action: label});
}
// audience: "admin" (Responsable QSSE, Chef de centre, Responsable Coordination uniquement)
//        ou "all" (admins + Responsable Traitement — ex. résultat conforme / non conforme)
function notify(dec, message, audience){
  state.notifications.unshift({id: Date.now()+Math.random(), declarationId: dec.id, message, date: nowStr(), read:false, audience: audience || "admin"});
}
function notifVisibleTo(n, role){
  if(isHSERole(role)) return true;                 // les 3 admins voient toutes les notifications
  if(role==="traitement") return n.audience==="all"; // traitement : uniquement conforme / non conforme
  return false;                                      // le déclarant n'a pas accès aux notifications
}

function submitDeclaration(){
  const f = state.form;
  if(!f.description.trim()){ toast("Merci de décrire la situation observée."); return; }
  const dec = {
    id: genId(),
    atelier: f.atelier || ATELIERS[0],
    dateCreation: nowStr(),
    declarant: { anonyme: f.anonyme, nom: f.anonyme ? "Anonyme" : (f.nom||"—"), matricule:f.matricule, fonction:f.fonction, service:f.service },
    categorie: f.categorie,
    description: f.description,
    graviteInitiale: f.gravite,
    graviteReelle: f.gravite,
    photos: f.photos,
    localisation: f.localisation,
    status: "nouvelle",
    analyse: null, affectation: null, planification: null, intervention: null, verification: null, cloture: null,
    historique: []
  };
  pushHistory(dec, "Déclaration créée par " + dec.declarant.nom + " — " + dec.atelier);
  notify(dec, (dec.graviteInitiale==="critique" ? "🔴 CRITIQUE — " : "") + "Nouvelle déclaration " + dec.id + " (" + dec.categorie + ") sur " + dec.atelier);
  state.declarations.unshift(dec);
  state.form = emptyForm();
  if(state.role !== "declarant"){ state.tab = "declarations"; }
  persist(); render();
  toast("Déclaration " + dec.id + " envoyée. Statut : Nouvelle déclaration.");
}

function findDec(id){ return state.declarations.find(d=>d.id===id); }

function doAnalyse(id, payload){
  const dec = findDec(id);
  dec.graviteReelle = payload.graviteReelle;
  dec.analyse = { typeRisque:payload.typeRisque, causeProbable:payload.causeProbable, commentaire:payload.commentaire, date: nowStr() };
  dec.status = "analyse";
  pushHistory(dec, "Analyse effectuée par le Responsable QSSE — risque : " + payload.typeRisque);
  persist(); render(); toast("Analyse enregistrée.");
}
function sendDeadlineEmail(dec, email){
  const subject = encodeURIComponent("Date limite de traitement — Déclaration " + dec.id);
  const body = encodeURIComponent(
    "Bonjour,\n\nUne déclaration vous a été affectée pour traitement.\n\n" +
    "Référence : " + dec.id + "\n" +
    "Atelier : " + dec.atelier + "\n" +
    "Gravité : " + gInfo(dec.graviteReelle).label + "\n" +
    "Service chargé : " + dec.affectation.service + "\n" +
    "Priorité : " + dec.affectation.priorite + "\n" +
    "Date limite (SLA) : " + dec.affectation.slaDate + "\n\n" +
    "Merci de planifier et de réaliser l'intervention avant cette échéance.\n\nCordialement."
  );
  pushHistory(dec, "Email de notification de la date limite envoyé à " + email + " (échéance : " + dec.affectation.slaDate + ")");
  window.open("mailto:" + email + "?subject=" + subject + "&body=" + body, "_blank");
}
function doPlanification(id, payload){
  const dec = findDec(id);
  dec.planification = payload;
  dec.status = "planifie";
  pushHistory(dec, "Intervention planifiée le " + payload.date + " à " + payload.heure);
  persist(); render(); toast("Intervention planifiée.");
}
function doIntervention(id, payload){
  const dec = findDec(id);
  dec.intervention = payload;
  dec.status = "realisee";
  pushHistory(dec, "Intervention réalisée — temps passé : " + payload.tempsPasse + " min");
  notify(dec, "Intervention réalisée sur " + dec.id + ", en attente de vérification QSSE");
  persist(); render(); toast("Intervention enregistrée.");
}
function doVerification(id, conforme, commentaire){
  const dec = findDec(id);
  dec.verification = { conforme, commentaire, date: nowStr() };
  if(conforme){
    dec.status = "cloture";
    dec.cloture = { commentaireFinal: commentaire, dateCloture: nowStr(), delaiReel: computeDelay(dec) };
    pushHistory(dec, "Vérification conforme — dossier clôturé");
    notify(dec, "Déclaration " + dec.id + " clôturée — vérification conforme", "all");
  } else {
    dec.status = "planifie";
    pushHistory(dec, "Non conforme — retour en planification");
    notify(dec, dec.id + " non conforme, nouvelle intervention requise", "all");
  }
  persist(); render(); toast(conforme ? "Dossier clôturé." : "Non conforme : retour à la planification.");
}
function computeDelay(dec){
  const start = new Date(dec.dateCreation.split(" ")[0].split("/").reverse().join("-"));
  const end = new Date();
  const days = Math.max(0, Math.round((end-start)/(1000*60*60*24)));
  return days + " j";
}

function ensurePdfSpace(doc, y, needed, pageH){
  if(y + needed > pageH - 14){
    doc.addPage();
    return 16;
  }
  return y;
}

async function imageForPDF(src){
  return new Promise(resolve=>{
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = ()=>{
      try{
        const canvas = document.createElement("canvas");
        const maxW = 900;
        const scale = Math.min(1, maxW / img.naturalWidth);
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      }catch(e){
        resolve(null);
      }
    };
    img.onerror = ()=>resolve(null);
    img.src = src;
  });
}

async function addPdfImages(doc, title, photos, y, pageH){
  if(!photos || !photos.length) return y;
  y = ensurePdfSpace(doc, y, 10, pageH);
  doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(40);
  doc.text(title, 14, y); y+=5;
  doc.setFont("helvetica","normal"); doc.setTextColor(60);
  let x = 14;
  const imgW = 42;
  const imgH = 32;
  for(let i=0; i<photos.length; i++){
    const dataUrl = await imageForPDF(photos[i]);
    if(!dataUrl) continue;
    y = ensurePdfSpace(doc, y, imgH + 8, pageH);
    doc.addImage(dataUrl, "JPEG", x, y, imgW, imgH);
    doc.setFontSize(7);
    doc.text("Image " + (i + 1), x, y + imgH + 4);
    x += imgW + 6;
    if(x + imgW > 196){
      x = 14;
      y += imgH + 9;
    }
  }
  if(x !== 14) y += imgH + 9;
  doc.setFontSize(9);
  return y;
}

async function exportDeclarationsPDF(){
  if(typeof window.jspdf==="undefined"){ toast("Bibliothèque PDF indisponible."); return; }
  const pdfDeclarations = state.declarations.filter(d=>!state.atelierScanne || d.atelier === state.atelierScanne);
  if(pdfDeclarations.length === 0){ toast("Aucune déclaration à exporter pour ces critères."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pageH = doc.internal.pageSize.getHeight();
  let y = 16;
  doc.setFont("helvetica","bold"); doc.setFontSize(14);
  doc.text("Registre des déclarations — Gestion Précurseurs (ONCF - PM - EMIC - TMLC)", 14, y); y+=6;
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(90);
  doc.text("Édité le " + nowStr() + " — " + pdfDeclarations.length + " déclaration(s)", 14, y); y+=8;
  doc.setDrawColor(200);

  for(const d of pdfDeclarations){
    if(y > pageH - 30){ doc.addPage(); y = 16; }
    doc.setTextColor(20); doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
    doc.text(d.id + "  —  " + d.atelier, 14, y); y+=5;
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(60);
    doc.text("Catégorie : " + d.categorie + "   |   Gravité : " + gInfo(d.graviteReelle).label + "   |   Statut : " + STATUS_LABEL[d.status] + "   |   Créée le : " + d.dateCreation, 14, y); y+=5;
    doc.text("Déclarant : " + d.declarant.nom + (d.declarant.service ? " (" + d.declarant.service + ")" : ""), 14, y); y+=5;
    const descLines = doc.splitTextToSize("Description : " + d.description, 180);
    doc.text(descLines, 14, y); y += descLines.length*4.2 + 1;
    if(d.affectation && d.affectation.slaDate){
      y = ensurePdfSpace(doc, y, 5, pageH);
      doc.text("Date limite de traitement : " + d.affectation.slaDate, 14, y); y+=5;
    }
    if(d.cloture){
      y = ensurePdfSpace(doc, y, 5, pageH);
      doc.text("Clôturée le " + d.cloture.dateCloture + " — délai réel : " + d.cloture.delaiReel, 14, y); y+=5;
    }
    const declarationPhotos = d.declarationPhotos || d.photos || [];
    const interventionPhotos = d.interventionPhotos || [];
    y = await addPdfImages(doc, "Images jointes à la déclaration", declarationPhotos, y, pageH);
    y = await addPdfImages(doc, "Images de l'intervention réalisée", interventionPhotos, y, pageH);
    doc.setDrawColor(220); doc.line(14, y, 196, y); y+=6;
  }

  doc.save("declarations_precurseurs_" + Date.now() + ".pdf");
  toast("Export PDF généré.");
}

function excelEscape(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

async function imageToDataUrl(src){
  if(!src) return "";
  if(String(src).startsWith("data:")) return src;
  try{
    const res = await fetch(src);
    const blob = await res.blob();
    return await new Promise(resolve=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result || "");
      reader.onerror = ()=>resolve("");
      reader.readAsDataURL(blob);
    });
  }catch(e){ return ""; }
}

async function excelImagesHTML(photos){
  const items = (photos || []).filter(Boolean);
  if(!items.length) return "";
  const images = [];
  for(let i=0; i<items.length; i++){
    const dataUrl = await imageToDataUrl(items[i]);
    if(dataUrl) images.push(`<div>Image ${i + 1}<br><img src="${dataUrl}" width="150"></div>`);
  }
  return images.join("<br>");
}

function dashboardSnapshotRows(declarations){
  const total = declarations.length;
  const open = declarations.filter(d=>d.status !== "cloture").length;
  const closed = declarations.filter(d=>d.status === "cloture").length;
  const critical = declarations.filter(d=>d.graviteReelle === "critique").length;
  const byAtelier = {};
  declarations.forEach(d=>{ byAtelier[d.atelier] = (byAtelier[d.atelier] || 0) + 1; });
  const rows = [
    ["Date export", nowStr()],
    ["Total déclarations", total],
    ["Déclarations ouvertes", open],
    ["Déclarations clôturées", closed],
    ["Déclarations critiques", critical],
    ["Taux de clôture", total ? Math.round((closed / total) * 100) + "%" : "0%"]
  ];
  Object.entries(byAtelier).forEach(([atelier, count])=>rows.push(["Atelier - " + atelier, count]));
  return rows;
}

async function exportDeclarationsExcel(){

  const headers = {};
  if(apiToken) headers.Authorization = "Bearer " + apiToken;
  try{

    if(!res.ok){
      const raw = await res.text();
      throw new Error(raw || "Export Excel impossible.");
    }
    const blob = await res.blob();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "archive_precurseurs_" + Date.now() + ".xlsx";
    document.body.appendChild(link);
    link.click();
    URL.revokeObjectURL(link.href);
    link.remove();
    toast("Fichier Excel avec images genere.");
  }catch(e){
    toast(e.message || "Export Excel impossible.");
  }
}

let toastTimer=null;
function toast(msg){
  const el = document.getElementById("toast");
  if(!el) return;
  el.textContent = msg; el.style.display="block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display="none"; }, 3200);
}

function bindButtonFeedback(){
  document.querySelectorAll("button").forEach(btn=>{
    if(btn.dataset.feedbackBound) return;
    btn.dataset.feedbackBound = "1";
    btn.addEventListener("click", ()=>{
      if(!btn.disabled) toast("Action prise en compte.");
    }, {capture:true});
  });
}

function gInfo(key){ return GRAVITES.find(g=>g.key===key) || GRAVITES[1]; }

function kpis(){
  const all = state.declarations;
  const total = all.length;
  const cloturees = all.filter(d=>d.status==="cloture").length;
  const ouvertes = total - cloturees;
  const critiques = all.filter(d=>d.graviteReelle==="critique" && d.status!=="cloture").length;
  const tauxCloture = total? Math.round(cloturees/total*100):0;
  const delais = all.filter(d=>d.cloture).map(d=>parseInt(d.cloture.delaiReel)||0);
  const delaiMoyen = delais.length? Math.round(delais.reduce((a,b)=>a+b,0)/delais.length) : 0;
  const respectSLA = all.filter(d=>d.affectation && d.status==="cloture").length; // simplified indicator
  return {total, cloturees, ouvertes, critiques, tauxCloture, delaiMoyen};
}

function historySummary(action){
  const a = String(action || "").toLowerCase();
  if(a.includes("photo")) return "Une image jointe a été ajoutée au dossier.";
  if(a.includes("declaration") || a.includes("déclaration")) return "La déclaration a été enregistrée et intégrée au circuit de traitement.";
  if(a.includes("analyse")) return "La situation a été analysée avec la gravité, le risque et la cause probable.";
  if(a.includes("affectation")) return "Le traitement a été affecté avec le responsable, la priorité, la date limite et le destinataire email.";
  if(a.includes("planification")) return "L'intervention a été planifiée avec la date, l'heure et les moyens prévus.";
  if(a.includes("intervention") || a.includes("realisee") || a.includes("réalisée")) return "Les actions correctives réalisées ont été renseignées.";
  if(a.includes("verification") || a.includes("vérification") || a.includes("conforme") || a.includes("cloture") || a.includes("clôture")) return "La vérification QSSE a été effectuée et la décision de conformité a été tracée.";
  if(a.includes("email")) return "Une notification email a été traitée pour cette phase.";
  return "Action enregistrée dans le suivi de la déclaration.";
}

function drawCharts(){
  if(typeof Chart==="undefined") return;
  const dark = "#9AA3AD";
  Chart.defaults.color = dark;
  Chart.defaults.borderColor = "#2C333D";

  const graviteData = GRAVITES.map(g=>state.declarations.filter(d=>d.graviteReelle===g.key).length);
  const cg = document.getElementById("chartGravite");
  if(cg) new Chart(cg, { type:"doughnut", data:{ labels: GRAVITES.map(g=>g.label),
    datasets:[{ data:graviteData, backgroundColor:["#2E9B6B","#F2B705","#FF6A2B","#E4432B"], borderWidth:0 }]},
    options:{ plugins:{legend:{position:"bottom", labels:{boxWidth:10, font:{size:11}}}} } });

  const catData = CATEGORIES.map(c=>state.declarations.filter(d=>d.categorie===c).length);
  const cc = document.getElementById("chartCategorie");
  if(cc) new Chart(cc, { type:"bar", data:{ labels:CATEGORIES,
    datasets:[{ data:catData, backgroundColor:"#4C8DFF", borderRadius:4 }]},
    options:{ plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false}}, y:{ ticks:{precision:0}, grid:{color:"#2C333D"} } } } });

  const statData = STATUS_ORDER.map(s=>state.declarations.filter(d=>d.status===s).length);
  const cs = document.getElementById("chartStatut");
  if(cs) new Chart(cs, { type:"bar", data:{ labels: STATUS_ORDER.map(s=>STATUS_LABEL[s]),
    datasets:[{ data:statData, backgroundColor:"#FF6A2B", borderRadius:4 }]},
    options:{ indexAxis:"y", plugins:{legend:{display:false}}, scales:{ x:{ ticks:{precision:0}, grid:{color:"#2C333D"} }, y:{grid:{display:false}} } } });
}

/* ---------- NOTIFICATIONS ---------- */
function lastNumericToken(value){
  const match = String(value || "").match(/(\d+)(?!.*\d)/);
  if(!match) return "";
  return String(Number(match[1]));
}

function notificationMatchesSearch(notification, query){
  const ref = String(notification.reference || "").toLowerCase();
  const message = String(notification.message || "").toLowerCase();
  if(!query) return true;
  if(ref.includes(query) || message.includes(query)) return true;
  if(/^\d+$/.test(query)){
    const normalizedQuery = String(Number(query));
    return lastNumericToken(ref) === normalizedQuery || lastNumericToken(message) === normalizedQuery;
  }
  return false;
}

function notificationsHTML(){
  const base = state.notifications.filter(n=>notifVisibleTo(n, state.role));
  const ref = (state.notificationFilters.reference || "").trim().toLowerCase();
  const refDraft = state.notificationSearchDraft !== null ? state.notificationSearchDraft : (state.notificationFilters.reference || "");
  const date = state.notificationFilters.date || "";
  const list = base.filter(n=>{
    const atelierOk = !state.atelierScanne || n.atelier === state.atelierScanne;
    const refOk = notificationMatchesSearch(n, ref);
    const dateOk = !date || n.declarationCreatedDate === date;
    return atelierOk && refOk && dateOk;
  });
  const unread = list.filter(n=>!n.read).length;
  return `<div class="panel">
    <div class="section-header">
      <div style="font-size:12.5px;color:var(--text-dim);">${unread} non lue(s) sur ${list.length} affichée(s) / ${base.length}</div>
    </div>
    <div class="notif-filters">
      <input type="text" id="notifRefFilter" placeholder="Rechercher par numéro précurseur, ex. PRC-2026-0006 ou 6" value="${refDraft || ""}">
      <input type="date" id="notifDateFilter" value="${state.notificationFilters.date || ""}">
      <button class="btn notif-search-btn" id="notifSearchBtn" type="button">Rechercher</button>
    </div>
    ${list.length===0 ? `<div class="empty">Aucune notification pour ces filtres.</div>` : ""}
    ${list.map(n=>`
      <div class="notif-row ${n.read?'is-read':''}">
        <div>
          <div style="font-size:13.5px;">${n.message}</div>
          <div style="font-size:11px;color:var(--text-dim);margin-top:3px;">${n.date} · ${n.atelier || "Atelier non défini"} · ${n.reference || ""}</div>
        </div>
        <span class="btn small ${n.read?'voir-read':'voir-unread'}" data-open="${n.declarationId}" data-notifid="${n.id}">${n.read?'✔ Vue':'Voir'}</span>
      </div>`).join("")}
  </div>`;
}

  if(isHSERole(role) && (dec.status==="analyse" || dec.status==="replanification")){
    const treatmentUsers = treatmentUsersForAtelier(dec.atelier);
    const isReplanification = dec.status==="replanification";
    return `
    <div class="section-title">${isReplanification ? "Replanification du deadline" : "Affectation du traitement"} (${roleLabel(role)})</div>
    ${isReplanification ? `<div class="hist-detail" style="display:block;margin-bottom:12px;">Traitement non conforme : saisissez une nouvelle date limite, puis affectez de nouveau le traitement.</div>` : ""}
    <div class="row2">
      <div class="field"><label>Service chargé</label><input type="text" id="af_service" placeholder="Ex. Maintenance" value="${(dec.affectation && dec.affectation.service) || ""}"></div>
      <div class="field"><label>Priorité</label>
        <select id="af_prio"><option>Basse</option><option selected>Normale</option><option>Haute</option><option>Urgente</option></select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Date limite (SLA)</label><input type="date" id="af_sla"></div>
      <div class="field"><label>Numeros WhatsApp selectionnes</label><div id="af_phones" class="selected-phone-list"><div style="font-size:12px;color:var(--text-dim);">Selectionnez un ou plusieurs responsables.</div></div><input type="hidden" id="af_phone_values"></div>
    </div>

      <label>Responsables de traitement</label>
      <div id="af_responsibles" class="check-list">
        ${treatmentUsers.map(u=>`<div class="check-option" data-responsible="${u.id}">
          <span class="check-icon">&#10003;</span>
          <span><span class="check-main">${u.full_name}</span><span class="check-sub">${u.phone_numbers || "Telephone non renseigne"}</span></span>
        </div>`).join("")}
      </div>
      ${treatmentUsers.length ? "" : `<div style="font-size:11px;color:var(--text-dim);margin-top:6px;">Aucun responsable de traitement n'est rattaché à l'atelier ${dec.atelier}.</div>`}
    </div>
    <div class="field"><label>Ressources nécessaires</label><input type="text" id="af_ress" placeholder="Ex. 2 collaborateurs, pièce détachée X" value="${(dec.affectation && dec.affectation.ressources) || ""}"></div>
    <button class="btn" id="btnAffecter" data-id="${dec.id}">${isReplanification ? "Valider la replanification et notifier" : "Affecter et notifier par WhatsApp"}</button>`;
  }
  // Traitement: planification
  if(role==="traitement" && dec.status==="affecte"){
    const deadlineDate = calendarDateValue(dec.affectation && dec.affectation.slaDate);
    const collaborators = collaboratorUsersForAtelier(dec.atelier);
    return `
    <div class="section-title">Planification de l'intervention</div>
    <div class="row2">
      <div class="field"><label>Date</label><input type="date" id="p_date" ${deadlineDate?`max="${deadlineDate}"`:''}></div>
      <div class="field"><label>Heure</label><input type="time" id="p_heure"></div>
    </div>
    <div class="field">
      <label>Collaborateurs affectés</label>
      <div id="p_collaborators" class="check-list">
        ${collaborators.map(u=>`<div class="check-option" data-collaborator="${u.id}">
          <span class="check-icon">&#10003;</span>
          <span><span class="check-main">${u.full_name}</span><span class="check-sub">${u.email} - ${u.phone_numbers || "Téléphone non renseigné"}</span></span>
        </div>`).join("")}
      </div>
      ${collaborators.length ? "" : `<div style="font-size:11px;color:var(--text-dim);margin-top:6px;">Aucun collaborateur disponible pour ${dec.atelier}. Vous pouvez en créer dans Utilisateurs.</div>`}
      <input type="hidden" id="p_tech">
    </div>
    <div class="field"><label>Matériel nécessaire</label><input type="text" id="p_mat" placeholder="Ex. Clé dynamométrique, EPI"></div>
    <button class="btn" id="btnPlanifier" data-id="${dec.id}">Planifier</button>`;
  }
  if(role==="traitement" && dec.status==="planifie"){
    const minDate = calendarDateValue(dec.planification && dec.planification.date);
    const maxDate = calendarDateValue(dec.affectation && dec.affectation.slaDate);
    const collabSummary = (dec.collaborateurs || []).length ? `
      <div class="field">
        <label>Tâches saisies par les collaborateurs</label>
        <div class="selected-phone-list">
          ${(dec.collaborateurs || []).map(c=>`<div class="selected-phone-pill"><b>${c.nom}</b> - ${c.taches || "En attente de saisie"}${c.completedAt ? ` (${c.completedAt})` : ""}</div>`).join("")}
        </div>
      </div>` : "";
    return `
    <div class="section-title">Réalisation des actions correctives</div>
    ${collabSummary}
    <div class="field"><label>Actions réalisées</label><textarea id="i_actions" placeholder="Décrire les travaux effectués"></textarea></div>
    <div class="row2">
      <div class="field"><label>Date de réalisation</label><input type="date" id="i_date" ${minDate?`min="${minDate}"`:''} ${maxDate?`max="${maxDate}"`:''}></div>
      <div class="field"><label>Difficultés rencontrées</label><input type="text" id="i_diff" placeholder="Optionnel"></div>
    </div>
    <div class="field"><label>Image intervention réalisée</label><input type="file" id="i_photos" accept="image/*" multiple></div>
    <button class="btn" id="btnIntervention" data-id="${dec.id}">Enregistrer l'intervention</button>`;
  }
  if(role==="collaborateur" && dec.status==="planifie"){
    const mine = (dec.collaborateurs || []).find(c=>state.currentUser && Number(c.userId)===Number(state.currentUser.id)) || {};
    const minDate = calendarDateValue(dec.planification && dec.planification.date);
    const maxDate = calendarDateValue(dec.affectation && dec.affectation.slaDate);
    return `
    <div class="section-title">Mes tâches réalisées</div>
    <div class="kv"><div class="k">Deadline</div><div>${(dec.affectation && dec.affectation.slaDate) || "—"}</div></div>
    <div class="kv"><div class="k">Planification</div><div>${(dec.planification && dec.planification.date) || "—"} à ${(dec.planification && dec.planification.heure) || "—"}</div></div>
    ${mine.completedAt ? `<div class="hist-detail" style="display:block;margin-bottom:12px;">Dernière saisie : ${mine.completedAt}</div>` : ""}
    <div class="row2">
      <div class="field"><label>Date de réalisation</label><input type="date" id="c_date" value="${mine.interventionDate || ""}" ${minDate?`min="${minDate}"`:''} ${maxDate?`max="${maxDate}"`:''}></div>
      <div class="field"><label>Durée calculée</label><input type="text" id="c_days" value="${mine.tempsJours || 0} jour(s)" disabled></div>

    <div class="field"><label>Travaux réalisés par moi</label><textarea id="c_task" placeholder="Décrire uniquement les tâches que vous avez réalisées">${mine.taches || ""}</textarea></div>

    return `
    <div class="section-title">Vérification de l'efficacité (${roleLabel(role)})</div>
    <div class="field"><label>Commentaire de vérification</label><textarea id="v_comment" placeholder="Constat sur le terrain"></textarea></div>

    return `<div class="section-title">Clôture</div>
      <div class="kv"><div class="k">Commentaire final</div><div>${dec.cloture.commentaireFinal||'—'}</div></div>

  }

}
function roleLabel(r){ return {declarant:"Déclarant", hse:"Responsable QSSE", chef_centre:"Chef de centre", coordination:"Responsable Coordination", traitement:"Responsable Traitement"}[r]; }

/* ============================= EVENTS ============================= */
function bindEvents(){
  const brandHome = document.getElementById("brandHome");
  if(brandHome) brandHome.onclick = ()=>{
    state.tab = "dashboard";
    state.openId = null;
    state.openHistoryIndex = null;
    state.previewImage = null;
    render();
  };
  document.querySelectorAll(".navitem").forEach(el=>{
    el.onclick = ()=>{ state.tab = el.dataset.tab; render(); };
  });
  const logoutBtn = document.getElementById("logoutBtn");
  if(logoutBtn) logoutBtn.onclick = ()=>{
    state.auth.loggedIn = false;
    state.role = null;
    state.loginSelectedRole = null;
    state.loginForm.error = "";
    state.tab = "dashboard";
    state.openId = null;
    state.openHistoryIndex = null;
    state.previewImage = null;
    state.currentUser = null;
    setQrDeclarationMode(false);
    render();
  };
  const atelierSel = document.getElementById("atelierSelect");
  if(atelierSel) atelierSel.onchange = e=>{ state.atelierScanne = e.target.value; render(); };
  const notifRefFilter = document.getElementById("notifRefFilter");
  const applyNotificationSearch = ()=>{
    state.notificationSearchDraft = notifRefFilter ? notifRefFilter.value : (state.notificationSearchDraft || "");
    state.notificationFilters.reference = state.notificationSearchDraft || "";
    render();
  };
  if(notifRefFilter) notifRefFilter.oninput = e=>{
    state.notificationSearchDraft = e.target.value;
  };
  if(notifRefFilter) notifRefFilter.onkeydown = e=>{
    if(e.key === "Enter"){
      e.preventDefault();
      applyNotificationSearch();
    }
  };
  const notifSearchBtn = document.getElementById("notifSearchBtn");
  if(notifSearchBtn) notifSearchBtn.onclick = applyNotificationSearch;
  const notifDateFilter = document.getElementById("notifDateFilter");
  if(notifDateFilter) notifDateFilter.onchange = e=>{
    state.notificationSearchDraft = notifRefFilter ? notifRefFilter.value : state.notificationSearchDraft;
    state.notificationFilters.date = e.target.value;
    render();
  };

  // form
  const bind = (id, key, checkbox)=>{
    const el = document.getElementById(id);
    if(el) el.oninput = e=>{ state.form[key] = checkbox ? e.target.checked : e.target.value; if(checkbox) render(); };
  };
  bind("f_nom","nom"); bind("f_matricule","matricule"); bind("f_fonction","fonction");
  bind("f_service","service"); bind("f_description","description"); bind("f_localisation","localisation");
  bind("f_anonyme","anonyme",true);
  const catSel = document.getElementById("f_categorie");
  if(catSel) catSel.onchange = e=>{ state.form.categorie = e.target.value; };
  const atelierFormSel = document.getElementById("f_atelier");
  if(atelierFormSel) atelierFormSel.onchange = e=>{ state.form.atelier = e.target.value; };
  document.querySelectorAll(".grav-btn").forEach(el=>{
    el.onclick = ()=>{ state.form.gravite = el.dataset.gravite; render(); };
  });
  const photoDrop = document.getElementById("photoDrop");
  const photoInput = document.getElementById("photoInput");
  if(photoDrop) photoDrop.onclick = ()=> photoInput.click();
  if(photoInput) photoInput.onchange = e=>{
    const files = Array.from(e.target.files);
    let remaining = files.length;
    if(remaining===0) return;
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = ev=>{ state.form.photos.push(ev.target.result); remaining--; if(remaining===0) render(); };
      reader.readAsDataURL(file);
    });
  };
  const submitBtn = document.getElementById("submitForm");
  if(submitBtn) submitBtn.onclick = submitDeclaration;

  // kanban / notif open
  document.querySelectorAll("[data-open]").forEach(el=>{
    el.onclick = ()=>{
      state.openId = el.dataset.open;
      state.openHistoryIndex = null;
      if(el.dataset.notifid){
        const n = state.notifications.find(x=>String(x.id)===el.dataset.notifid);
        if(n){ n.read = true; persist(); }
      }
      render();
    };
  });
  const btnExportPDF = document.getElementById("btnExportPDF");
  if(btnExportPDF) btnExportPDF.onclick = exportDeclarationsExcel;
  const btnClearDeclarations = document.getElementById("btnClearDeclarations");
  if(btnClearDeclarations) btnClearDeclarations.onclick = async ()=>{
    const password = prompt("Saisissez le mot de passe QSSE pour confirmer la remise à zéro de la plateforme.");
    if(!password) return;
    const ok = confirm("Cette action supprimera définitivement toutes les déclarations et leurs historiques. Confirmez-vous la remise à zéro ?");
    if(!ok) return;
    try{
      await api("/declarations", {method:"DELETE", body:JSON.stringify({password})});
      state.declarations = [];
      state.notifications = [];
      state.openId = null;
      await refreshData();
      render();
      toast("Toutes les déclarations ont été supprimées.");
    }catch(e){
      toast(e.message || "Suppression impossible.");
    }
  };
  const closeM = document.getElementById("closeModal");
  if(closeM) closeM.onclick = ()=>{ state.openId = null; state.openHistoryIndex = null; render(); };
  const overlay = document.getElementById("overlay");
  if(overlay) overlay.onclick = (e)=>{ if(e.target.id==="overlay"){ state.openId=null; state.openHistoryIndex=null; render(); } };
  const imagePreview = document.getElementById("imagePreview");
  if(imagePreview) imagePreview.onclick = ()=>{ state.previewImage = null; render(); };
  document.querySelectorAll("[data-preview]").forEach(img=>{
    img.onclick = ()=>{ state.previewImage = img.dataset.preview; render(); };
  });
  document.querySelectorAll("[data-history-index]").forEach(item=>{
    item.onclick = ()=>{
      const idx = Number(item.dataset.historyIndex);
      state.openHistoryIndex = state.openHistoryIndex === idx ? null : idx;
      render();
    };
  });

  // workflow actions
  const btnAnalyse = document.getElementById("btnAnalyse");
  if(btnAnalyse) btnAnalyse.onclick = ()=>{
    doAnalyse(btnAnalyse.dataset.id, {
      graviteReelle: document.getElementById("a_gravite").value,
      typeRisque: document.getElementById("a_type").value || "Non précisé",
      causeProbable: document.getElementById("a_cause").value || "Non précisée",
      commentaire: document.getElementById("a_comment").value
    });
  };
  const btnAffecter = document.getElementById("btnAffecter");
  document.querySelectorAll("[data-responsible]").forEach(option=>{
    option.onclick = ()=>{
      option.classList.toggle("selected");
      const selectedUsers = selectedTreatmentUsers();
      const phonesBox = document.getElementById("af_phones");
      const phoneValues = document.getElementById("af_phone_values");
      if(phonesBox) phonesBox.innerHTML = selectedPhoneListHTML(selectedUsers);
      if(phoneValues) phoneValues.value = phoneStringForUsers(selectedUsers);
    };
  });
  if(btnAffecter) btnAffecter.onclick = ()=>{
    const selectedUsers = selectedTreatmentUsers();
    if(selectedUsers.length === 0){
      toast("Sélectionnez au moins un responsable de traitement.");
      return;
    }
    doAffectation(btnAffecter.dataset.id, {
      service: document.getElementById("af_service").value || "Non précisé",
      responsable: selectedUsers.map(u=>u.full_name).join(", ") || "Non précisé",
      responsibleIds: selectedUsers.map(u=>Number(u.id)),
      priorite: document.getElementById("af_prio").value,
      slaDate: document.getElementById("af_sla").value || "—",
      ressources: document.getElementById("af_ress").value,
      phoneNumbers: (document.getElementById("af_phone_values") && document.getElementById("af_phone_values").value.trim()) || ""
    });
  };
  document.querySelectorAll("[data-collaborator]").forEach(option=>{
    option.onclick = ()=>{
      option.classList.toggle("selected");
      const hidden = document.getElementById("p_tech");
      if(hidden) hidden.value = selectedCollaboratorUsers().map(u=>u.full_name).join(", ");
    };
  });
  const btnPlanifier = document.getElementById("btnPlanifier");
  if(btnPlanifier) btnPlanifier.onclick = ()=>{
    const dec = findDec(btnPlanifier.dataset.id);
    const plannedDate = document.getElementById("p_date").value;
    const deadlineDate = calendarDateValue(dec && dec.affectation && dec.affectation.slaDate);
    if(!plannedDate){
      toast("Merci de choisir la date de planification.");
      return;
    }
    if(deadlineDate && plannedDate > deadlineDate){
      toast("La date de planification ne peut pas dépasser la date limite.");
      return;
    }
    doPlanification(btnPlanifier.dataset.id, {
      date: plannedDate,
      heure: document.getElementById("p_heure").value || "—",
      techniciens: document.getElementById("p_tech").value,
      collaboratorIds: selectedCollaboratorUsers().map(u=>Number(u.id)),
      materiel: document.getElementById("p_mat").value
    });
  };
  const btnIntervention = document.getElementById("btnIntervention");
  if(btnIntervention) btnIntervention.onclick = ()=>{
    const dec = findDec(btnIntervention.dataset.id);
    const interventionDate = document.getElementById("i_date").value;
    const plannedDate = calendarDateValue(dec && dec.planification && dec.planification.date);
    const deadlineDate = calendarDateValue(dec && dec.affectation && dec.affectation.slaDate);
    if(!interventionDate){
      toast("Merci de choisir la date de réalisation.");
      return;
    }
    if(plannedDate && interventionDate < plannedDate){
      toast("La date de réalisation ne peut pas être antérieure à la date de planification.");
      return;
    }
    if(deadlineDate && interventionDate > deadlineDate){
      toast("La date de réalisation ne peut pas dépasser la date limite.");
      return;
    }
    doIntervention(btnIntervention.dataset.id, {
      actions: document.getElementById("i_actions").value,
      interventionDate,
      tempsJours: daysBetween(plannedDate, interventionDate),
      difficultes: document.getElementById("i_diff").value,
      photos: Array.from((document.getElementById("i_photos") || {}).files || [])
    });
  };
  const btnConforme = document.getElementById("btnConforme");
  if(btnConforme) btnConforme.onclick = ()=> doVerification(btnConforme.dataset.id, true, document.getElementById("v_comment").value);
  const btnNonConforme = document.getElementById("btnNonConforme");
  if(btnNonConforme) btnNonConforme.onclick = ()=> doVerification(btnNonConforme.dataset.id, false, document.getElementById("v_comment").value);
  const btnCollaboratorTask = document.getElementById("btnCollaboratorTask");
  if(btnCollaboratorTask) btnCollaboratorTask.onclick = ()=>{
    const dec = findDec(btnCollaboratorTask.dataset.id);
    const interventionDate = document.getElementById("c_date").value;
    const plannedDate = calendarDateValue(dec && dec.planification && dec.planification.date);
    const deadlineDate = calendarDateValue(dec && dec.affectation && dec.affectation.slaDate);
    if(!interventionDate){ toast("Merci de choisir la date de réalisation."); return; }
    if(plannedDate && interventionDate < plannedDate){ toast("La date de réalisation ne peut pas être antérieure à la date de planification."); return; }
    if(deadlineDate && interventionDate > deadlineDate){ toast("La date de réalisation ne peut pas dépasser la date limite."); return; }
    doCollaboratorTask(btnCollaboratorTask.dataset.id, {
      taskDescription: document.getElementById("c_task").value,
      interventionDate,
      days: daysBetween(plannedDate, interventionDate),
      difficulties: document.getElementById("c_diff").value,
      photos: Array.from((document.getElementById("c_photos") || {}).files || [])
    });
  };
}

/* ============================= BACKEND API BINDING ============================= */
const API_BASE = window.GESPREC_API_BASE || "";
let apiToken = localStorage.getItem("gesprec_token") || "";
const savedUser = localStorage.getItem("gesprec_user");

function mediaUrl(path){
  if(!path) return "";
  if(path.startsWith("data:") || path.startsWith("http://") || path.startsWith("https://")) return path;
  return API_BASE + path;
}

const urlAtelier = new URLSearchParams(window.location.search).get("atelier");
const declarationScan = new URLSearchParams(window.location.search).get("declaration");
if(urlAtelier && ATELIERS.includes(urlAtelier)){
  apiToken = "";
  localStorage.removeItem("gesprec_token");
  localStorage.removeItem("gesprec_user");
  setQrDeclarationMode(true);
  state.atelierScanne = urlAtelier;
  state.qrAtelierLocked = true;
  state.form.atelier = urlAtelier;
  state.role = "declarant";
  state.auth.loggedIn = true;
  state.tab = "nouvelle";
}else if(declarationScan){
  apiToken = "";
  localStorage.removeItem("gesprec_token");
  localStorage.removeItem("gesprec_user");
  state.qrAtelierLocked = false;
  setQrDeclarationMode(true);
  state.role = "declarant";
  state.auth.loggedIn = true;
  state.tab = "nouvelle";
}
if(apiToken && savedUser){
  try{
    const u = JSON.parse(savedUser);
    state.auth.loggedIn = true;
    state.role = u.role;
    state.loginSelectedRole = u.role;
    state.currentUser = u;
    applyUserAtelierScope(u);
  }catch(e){ localStorage.removeItem("gesprec_user"); }
}

async function api(path, options = {}){
  const headers = options.headers ? {...options.headers} : {};
  if(options.body && !(options.body instanceof FormData) && !(options.body instanceof URLSearchParams)){
    headers["Content-Type"] = headers["Content-Type"] || "application/json";
  }
  if(apiToken) headers.Authorization = "Bearer " + apiToken;
  const res = await fetch(API_BASE + path, {...options, headers});
  if(!res.ok){
    let msg = "Erreur API";
    const raw = await res.text();
    try{
      const err = JSON.parse(raw);
      msg = err.detail || JSON.stringify(err);
    }catch(e){
      msg = raw || msg;
    }
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}

function fmtDate(value){
  if(!value) return "—";
  const d = new Date(value);
  return isNaN(d.getTime()) ? value : d.toLocaleString("fr-FR");
}

function normalizeCategory(value){
  const map = {
    "SÃ©curitÃ©":"Securite",
    "Sécurité":"Securite",
    "SÃ»retÃ©":"Surete",
    "Sûreté":"Surete",
    "QualitÃ©":"Qualite",
    "Qualité":"Qualite",
    "Environnement":"Environnement",
    "Maintenance":"Maintenance",
    "Securite":"Securite",
    "Surete":"Surete",
    "Qualite":"Qualite"
  };
  return map[value] || value;
}

function displayCategory(value){
  const map = {Securite:"Sécurité", Surete:"Sûreté", Qualite:"Qualité", Environnement:"Environnement", Maintenance:"Maintenance"};
  return map[value] || value;
}

function applyUserAtelierScope(user){
  if(user && (user.role === "traitement" || user.role === "collaborateur")) return;
  const ateliers = String((user && user.responsible_ateliers) || "")
    .split(/[;,]/)
    .map(x=>x.trim())
    .filter(Boolean);
  if(!ateliers.length) return;
  state.atelierScanne = ateliers[0];
  state.form.atelier = ateliers[0];
  state.qrAtelierLocked = true;
}

function mapDeclaration(d){
  const closedAt = d.closed_at ? fmtDate(d.closed_at) : null;
  const createdAt = fmtDate(d.created_at);
  const apiId = d.id;
  const displayId = d.reference || String(d.id);
  const history = (d.history || []).map(h=>({date:fmtDate(h.created_at), action:h.action}));
  const photoItems = (d.photos || []).map(p=>({src:p.data_url || mediaUrl("/uploads/" + p.filename), phase:p.phase || "declaration"}));
  const declarationPhotos = photoItems.filter(p=>p.phase !== "intervention").map(p=>p.src);
  const interventionPhotos = photoItems.filter(p=>p.phase === "intervention").map(p=>p.src);
  return {
    apiId,
    id: displayId,
    atelier: d.atelier,
    dateCreation: createdAt,
    declarant: {
      anonyme: d.anonymous,

function mapNotification(n){
  const dec = state.declarations.find(d=>d.apiId === n.declaration_id);
  return {
    id: n.id,
    declarationId: dec ? dec.id : String(n.declaration_id),
    reference: dec ? dec.id : String(n.declaration_id),
    atelier: dec ? dec.atelier : "",
    declarationCreatedDate: dec ? calendarDateValue(dec.dateCreation) : "",
    message: n.message,
    date: fmtDate(n.created_at),
    read: n.read,
    audience: n.audience
  };
}

async function refreshData(){
  if(!state.auth.loggedIn || state.role === "declarant") return;
  try{
    if(state.role === "collaborateur"){
      const declarations = await api("/declarations");
      state.declarations = declarations.map(mapDeclaration);
      state.notifications = [];
      state.dashboardStats = null;
      state.tab = "declarations";
      return;
    }
    const stats = await api("/dashboard/stats");
    state.dashboardStats = stats;
    if(state.role === "chef_etablissement"){
      state.declarations = (stats.latest || []).map(mapDeclaration);
      state.notifications = [];
      state.tab = "dashboard";
      return;
    }
    const declarations = await api("/declarations");
    state.declarations = declarations.map(mapDeclaration);
    const notifications = await api("/notifications").catch(()=>[]);
    state.notifications = notifications.map(mapNotification);
    if(isHSERole(state.role) || state.role==="traitement"){
      state.users = await api("/auth/users").catch(()=>[]);
      if(state.role === "hse"){
        state.whatsappStatus = await api("/system/whatsapp-status").catch(()=>null);
      }
    }
  }catch(e){
    toast(e.message || "Impossible de charger les données.");
  }
}

bindLoginEvents = function(){
  document.querySelectorAll(".role-card").forEach(el=>{
    el.onclick = ()=>{ state.loginSelectedRole = el.dataset.role; state.loginForm.error=""; if(el.dataset.role !== "declarant") state.lastDeclarationReceipt = null; render(); };
  });
  const btnEnterDeclarant = document.getElementById("btnEnterDeclarant");
  if(btnEnterDeclarant) btnEnterDeclarant.onclick = ()=>{
    apiToken = "";
    localStorage.removeItem("gesprec_token");
    localStorage.removeItem("gesprec_user");
    setQrDeclarationMode(false);
    state.role = "declarant";
    state.auth.loggedIn = true;
    state.tab = "nouvelle";
    render();
  };
  const btnLogin = document.getElementById("btnLogin");
  if(btnLogin) btnLogin.onclick = async ()=>{
    const u = (document.getElementById("loginUser").value||"").trim();
    const p = (document.getElementById("loginPass").value||"").trim();
    if(!u || !p){ state.loginForm.error = "Veuillez renseigner votre identifiant et votre mot de passe."; render(); return; }
    try{
      const body = new URLSearchParams({username:u, password:p});
      const data = await api("/auth/login", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body});
      apiToken = data.access_token;
      localStorage.setItem("gesprec_token", apiToken);
      localStorage.setItem("gesprec_user", JSON.stringify(data.user));
      state.role = data.user.role;
      state.auth.loggedIn = true;
      state.loginSelectedRole = data.user.role;
      state.currentUser = data.user;
      applyUserAtelierScope(data.user);
      state.loginForm.error = "";
      state.tab = data.user.role === "collaborateur" ? "declarations" : "dashboard";
      await refreshData();
      render();
    }catch(e){
      state.loginForm.error = e.message || "Connexion impossible.";
      render();
    }
  };
  bindButtonFeedback();
};

    option.onclick = ()=> option.classList.toggle("selected");
  });
  document.querySelectorAll("[data-edit-user]").forEach(btn=>{
    btn.onclick = ()=>{
      const u = (state.users || []).find(x=>String(x.id)===String(btn.dataset.editUser));
      if(!u) return;
      document.getElementById("u_id").value = u.id;
      document.getElementById("u_email").value = u.email;

      document.getElementById("u_role").value = u.role;

      const ateliers = splitMulti(u.responsible_ateliers);
      document.querySelectorAll("[data-user-atelier]").forEach(option=>{
        option.classList.toggle("selected", ateliers.includes(option.dataset.userAtelier));
      });
      document.getElementById("u_password").value = "";
    };
  });
  document.querySelectorAll("[data-delete-user]").forEach(btn=>{
    btn.onclick = async ()=>{
      const u = (state.users || []).find(x=>String(x.id)===String(btn.dataset.deleteUser));
      if(!u) return;
      if(!confirm("Supprimer le compte " + u.email + " ?")) return;
      try{
        await api("/auth/users/" + u.id, {method:"DELETE"});
        await refreshData();
        render();
      toast("Utilisateur supprimé.");
      }catch(e){ toast(e.message || "Suppression impossible."); }
    };
  });
  const clearUser = document.getElementById("btnClearUser");
  if(clearUser) clearUser.onclick = ()=>{
    ["u_id","u_email","u_name","u_password","u_phone_numbers"].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=""; });
    document.querySelectorAll("[data-user-atelier]").forEach(option=>option.classList.remove("selected"));
  };
  const saveUser = document.getElementById("btnSaveUser");
  if(saveUser) saveUser.onclick = async ()=>{
    const id = document.getElementById("u_id").value;
    const payload = {
      email: document.getElementById("u_email").value.trim(),
      full_name: document.getElementById("u_name").value.trim(),
      role: document.getElementById("u_role").value,
      is_active: true,
      phone_numbers: document.getElementById("u_phone_numbers").value.trim(),
      responsible_ateliers: selectedAteliersFromChecklist().join(", ")
    };
    const password = document.getElementById("u_password").value;
    if(password) payload.password = password;
    if(state.role==="traitement" && !id && !password){
      toast("Merci de définir le mot de passe du collaborateur.");
      return;
    }
    try{
      if(id) await api("/auth/users/" + id, {method:"PATCH", body:JSON.stringify(payload)});
      else await api("/auth/users", {method:"POST", body:JSON.stringify({...payload, password: password || "ChangeMe123!"})});
      await refreshData(); render(); toast("Utilisateur enregistré.");
    }catch(e){ toast(e.message || "Enregistrement impossible."); }
  };
  const changeMine = document.getElementById("btnChangeMyPassword");
  if(changeMine) changeMine.onclick = async ()=>{
    try{
      await api("/auth/change-password", {method:"POST", body:JSON.stringify({
        current_password: document.getElementById("my_current_password").value,
        new_password: document.getElementById("my_new_password").value
      })});
      toast("Mot de passe changé.");
    }catch(e){ toast(e.message || "Changement impossible."); }
  };
  bindButtonFeedback();
};

  if(state.dashboardStats && state.dashboardStats.totals){
    const t = state.dashboardStats.totals;
    const total = t.total || 0;
    const cloturees = t.closed || 0;
    const ouvertes = t.open || 0;
    const critiques = t.critical || 0;
    const tauxCloture = total ? Math.round(cloturees / total * 100) : 0;
    return {total, cloturees, ouvertes, critiques, tauxCloture, delaiMoyen:0};
  }
  const all = state.declarations;
  const total = all.length;
  const cloturees = all.filter(d=>d.status==="cloture").length;
  const ouvertes = total - cloturees;
  const critiques = all.filter(d=>d.graviteReelle==="critique" && d.status!=="cloture").length;
  const tauxCloture = total? Math.round(cloturees/total*100):0;
  return {total, cloturees, ouvertes, critiques, tauxCloture, delaiMoyen:0};
};

function statsCount(group, key){
  return state.dashboardStats && state.dashboardStats[group] ? (state.dashboardStats[group][key] || 0) : null;
}

drawCharts = function(){
  if(typeof Chart==="undefined") return;
  Chart.defaults.color = "#9AA3AD";
  Chart.defaults.borderColor = "#2C333D";
  const graviteData = GRAVITES.map(g=>statsCount("by_gravity", g.key) ?? state.declarations.filter(d=>d.graviteReelle===g.key).length);
  const cg = document.getElementById("chartGravite");
  if(cg) new Chart(cg, { type:"doughnut", data:{ labels: GRAVITES.map(g=>g.label),
    datasets:[{ data:graviteData, backgroundColor:["#2E9B6B","#F2B705","#FF6A2B","#E4432B"], borderWidth:0 }]},
    options:{ plugins:{legend:{position:"bottom", labels:{boxWidth:10, font:{size:11}}}} } });

  const catData = CATEGORIES.map(c=>statsCount("by_category", normalizeCategory(c)) ?? state.declarations.filter(d=>d.categorie===c).length);
  const cc = document.getElementById("chartCategorie");
  if(cc) new Chart(cc, { type:"bar", data:{ labels:CATEGORIES,
    datasets:[{ data:catData, backgroundColor:"#4C8DFF", borderRadius:4 }]},
    options:{ plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false}}, y:{ ticks:{precision:0}, grid:{color:"#2C333D"} } } } });

  const statData = STATUS_ORDER.map(s=>statsCount("by_status", s) ?? state.declarations.filter(d=>d.status===s).length);
  const cs = document.getElementById("chartStatut");
  if(cs) new Chart(cs, { type:"bar", data:{ labels: STATUS_ORDER.map(s=>STATUS_LABEL[s]),
    datasets:[{ data:statData, backgroundColor:"#FF6A2B", borderRadius:4 }]},
    options:{ indexAxis:"y", plugins:{legend:{display:false}}, scales:{ x:{ ticks:{precision:0}, grid:{color:"#2C333D"} }, y:{grid:{display:false}} } } });
};

async function dataUrlToFile(dataUrl, name){
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  return new File([blob], name, {type:blob.type || "image/jpeg"});
}

async function uploadFormPhotos(apiId, photos){
  for(let i=0; i<photos.length; i++){
    if(!String(photos[i]).startsWith("data:")) continue;
    const file = await dataUrlToFile(photos[i], "photo-" + (i+1) + ".jpg");
    const body = new FormData();
    body.append("file", file);
    await api("/declarations/" + apiId + "/photos?phase=declaration", {method:"POST", body});
  }
}

async function uploadPhotoFiles(apiId, files){
  for(let i=0; i<files.length; i++){
    const body = new FormData();
    body.append("file", files[i]);
    await api("/declarations/" + apiId + "/photos?phase=intervention", {method:"POST", body});
  }
}

submitDeclaration = async function(){
  const f = state.form;
  if(!f.description.trim()){ toast("Merci de decrire la situation observee."); return; }
  const submittedFromQr = qrDeclarationMode() || (document.querySelector(".form-panel") || {}).dataset?.qrMode === "1";
  try{
    const payload = {
      atelier: f.atelier || ATELIERS[0],
      category: normalizeCategory(f.categorie),
      description: f.description,
      gravity: f.gravite,
      anonymous: f.anonyme,
      reporter_name: f.anonyme ? "Anonyme" : (f.nom || ""),
      reporter_matricule: f.matricule || "",
      reporter_function: f.fonction || "",
      reporter_service: f.service || "",
      location: f.localisation || ""
    };
    const created = await api("/declarations", {method:"POST", body:JSON.stringify(payload)});
    if(f.photos.length) await uploadFormPhotos(created.id, f.photos);
    const receiptNumber = created.reference || created.id;
    state.form = emptyForm();
    if(submittedFromQr){
      setQrDeclarationMode(true);
      state.lastDeclarationReceipt = receiptNumber;
      state.auth.loggedIn = true;
      state.role = "declarant";
      state.tab = "nouvelle";
      state.openId = null;
      state.openHistoryIndex = null;
      state.previewImage = null;
    }else if(state.role === "declarant"){
      apiToken = "";
      localStorage.removeItem("gesprec_token");
      localStorage.removeItem("gesprec_user");
      state.auth.loggedIn = false;
      state.role = null;
      state.loginSelectedRole = null;
      state.loginForm.error = "";
      state.tab = "dashboard";
      state.openId = null;
      state.openHistoryIndex = null;
      state.previewImage = null;
      state.lastDeclarationReceipt = receiptNumber;
    }else{
      await refreshData();
    }
    render();
    toast("Déclaration reçue - Numéro : " + receiptNumber);
  }catch(e){ toast(e.message || "Envoi impossible."); }
};

    const dec = findDec(id);

    try{
        const response = await api("/declarations/" + dec.apiId + "/affectation", {
            method: "POST",
            body: JSON.stringify({
                service: payload.service,
                responsible: payload.responsable,
                responsible_ids: payload.responsibleIds || [],
                priority: payload.priorite,
                sla_date: payload.slaDate,
                resources: payload.ressources,
                phone_numbers: payload.phoneNumbers || null,
                email: null
            })
        });

        await refreshData();
        render();

        // Open WhatsApp after a successful assignment
        const phoneList = splitMulti(payload.phoneNumbers);

        if (phoneList.length) {

            const message = `
Bonjour,

Une nouvelle déclaration GESPREC vous a été affectée.

Référence : ${dec.id}
Atelier : ${dec.atelier}
Service : ${payload.service}
Priorité : ${payload.priorite}
Date limite : ${payload.slaDate}

Merci de consulter la plateforme GESPREC afin de traiter cette demande.

Cordialement.
`;

            phoneList.forEach(phone => {

                const cleanPhone = phone
                    .replace(/\s+/g, "")
                    .replace("+", "");

                const url =
                    `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;

                window.open(url, "_blank");
            });

            toast("Déclaration affectée. Notification WhatsApp ouverte.");
        } else {
            toast("Déclaration affectée.");
        }

    } catch(e){
        toast(e.message || "Affectation impossible.");
    }
};

doPlanification = async function(id, payload){
  const dec = findDec(id);
  try{
    const plannedDate = payload.date;
    const deadlineDate = calendarDateValue(dec.affectation && dec.affectation.slaDate);
    if(!plannedDate || plannedDate === "—"){
      toast("Merci de choisir la date de planification.");
      return;
    }
    if(deadlineDate && plannedDate > deadlineDate){
      toast("La date de planification ne peut pas dépasser la date limite.");
      return;
    }
    await api("/declarations/" + dec.apiId + "/planification", {method:"POST", body:JSON.stringify({
      date: payload.date,
      time: payload.heure,
      technicians: payload.techniciens,
      collaborator_ids: payload.collaboratorIds || [],
      material: payload.materiel
    })});
    await refreshData(); render(); toast("Intervention planifiée.");
  }catch(e){ toast(e.message || "Planification impossible."); }
};

doIntervention = async function(id, payload){
  const dec = findDec(id);
  try{
    const plannedDate = calendarDateValue(dec.planification && dec.planification.date);
    const deadlineDate = calendarDateValue(dec.affectation && dec.affectation.slaDate);
    if(plannedDate && payload.interventionDate && payload.interventionDate < plannedDate){
      toast("La date de réalisation ne peut pas être antérieure à la date de planification.");
      return;
    }
    if(deadlineDate && payload.interventionDate && payload.interventionDate > deadlineDate){
      toast("La date de réalisation ne peut pas dépasser la date limite.");
      return;
    }
    await api("/declarations/" + dec.apiId + "/intervention", {method:"POST", body:JSON.stringify({
      actions: payload.actions,
      minutes: 0,
      days: Number(payload.tempsJours || daysBetween(plannedDate, payload.interventionDate)),
      intervention_date: payload.interventionDate,
      difficulties: payload.difficultes
    })});
    if(payload.photos && payload.photos.length){
      await uploadPhotoFiles(dec.apiId, payload.photos);
    }
    await refreshData(); render(); toast("Intervention enregistrée.");
  }catch(e){ toast(e.message || "Intervention impossible."); }
};
