services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - gesprec_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gesprec
      POSTGRES_USER: gesprec
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - gesprec_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gesprec -d gesprec"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gesprec_db:
  gesprec_uploads:
